<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        @keyframes pulse-loader {
            0%, 100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.5);
                opacity: 1;
            }
        }

        .loader-dot {
            animation: pulse-loader 1.4s infinite ease-in-out both;
        }

        .loader-dot:nth-child(1) { animation-delay: -0.32s; }
        .loader-dot:nth-child(2) { animation-delay: -0.16s; }

        /* Floating effect for background elements */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .animate-float {
            animation: float-slow 6s ease-in-out infinite;
        }

        /* Fade in entrance */
        .fade-in-up {
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<img alt="FitOra Brand Logo" class="w-32 h-32 md:w-40 md:h-40 rounded-md object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCMF4c6R7fFM6kdZFJ5Mk4o5ZtnMArRXj3prUQKl6Bf1F2ZdlwWn_K9XmtIXZFvqioVmheTEWwniVKFCuCh43htrghwzNt1SialbfV4SwzSEiIsQpb9mo9UXag2-29iuJ3huJkLWxy7TY1gcoASMvsePvNosWmSbAZRZ5xXGm_H5AWATFn-g6uG21gZ1oC1xaDFI9KwxIYw2Ii_gHDoYK7TIsGXO49ngJNvvyMrZrzS3KkrEkAfsFK7"/>

<div class="absolute inset-0 opacity-[0.03]" style="background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');"></div>
</div>
<script>
        // Micro-interaction: Subtle parallax on mouse move for desktop
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            const bg = document.querySelector('.animate-float');
            if(bg) {
                bg.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Simulate a transition to login or home after 4 seconds
        setTimeout(() => {
            console.log('Redirecting to dashboard or login...');
            // In a real app: window.location.href = '/login';
        }, 4000);
    </script>
