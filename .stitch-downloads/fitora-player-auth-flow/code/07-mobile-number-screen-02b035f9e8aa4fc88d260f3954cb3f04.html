<!-- App Flow Scripts -->
<script>
        let mobileNumber = "";
        const maxDigits = 10;
        const display = document.getElementById('number-display');
        const cursor = document.getElementById('cursor');

        function updateDisplay() {
            // Split into groups for readability (e.g., 98765 43210)
            let formatted = mobileNumber;
            if (mobileNumber.length > 5) {
                formatted = mobileNumber.slice(0, 5) + " " + mobileNumber.slice(5);
            }

            // Re-render display content
            display.innerHTML = '';
            const textSpan = document.createElement('span');
            textSpan.textContent = formatted;
            display.appendChild(textSpan);
            display.appendChild(cursor);

            // Hide cursor if full
            if (mobileNumber.length >= maxDigits) {
                cursor.style.display = 'none';
            } else {
                cursor.style.display = 'inline-block';
            }
        }

        function addNumber(num) {
            if (mobileNumber.length < maxDigits) {
                mobileNumber += num;
                updateDisplay();
                // Haptic feedback simulation
                if (window.navigator.vibrate) window.navigator.vibrate(5);
            }
        }

        function removeNumber() {
            if (mobileNumber.length > 0) {
                mobileNumber = mobileNumber.slice(0, -1);
                updateDisplay();
            }
        }

        // Initialize display
        updateDisplay();
    </script>
