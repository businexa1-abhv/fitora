<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scanner-frame {
            background: linear-gradient(to bottom, transparent 0%, transparent 100%) padding-box,
                        linear-gradient(to bottom, #4edea3 0%, #4edea3 100%) border-box;
            border: 4px solid transparent;
            position: relative;
        }
        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #4edea3, transparent);
            box-shadow: 0 0 15px #4edea3;
            animation: scan 3s ease-in-out infinite;
        }
        @keyframes scan {
            0%, 100% { transform: translateY(0); opacity: 0.2; }
            50% { transform: translateY(240px); opacity: 1; }
        }
        .reticle-corner {
            width: 40px;
            height: 40px;
            border-color: #4edea3;
            position: absolute;
        }
    </style>

<body class="bg-background text-on-background font-body-md text-body-md overflow-hidden">

<!-- Floating Action Button Logic (Suppressed as per rules for detailed task screens) -->
<script>
        // Micro-interactions and simulation
        const flashBtn = document.getElementById('flash-toggle');
        let flashOn = false;

        flashBtn.addEventListener('click', () => {
            flashOn = !flashOn;
            const icon = flashBtn.querySelector('.material-symbols-outlined');
            icon.textContent = flashOn ? 'flashlight_off' : 'flashlight_on';
            flashBtn.classList.toggle('bg-white/40', flashOn);
            
            // Visual feedback for "flash"
            if(flashOn) {
                document.body.insertAdjacentHTML('beforeend', '<div id="flash-overlay" class="fixed inset-0 bg-white/30 z-[60] pointer-events-none"></div>');
                setTimeout(() => document.getElementById('flash-overlay')?.remove(), 100);
            }
        });

        // Simulate a successful scan
        const simulateScan = () => {
            const toast = document.getElementById('check-in-success');
            const toastContent = toast.querySelector('div');
            
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toastContent.classList.remove('scale-90');
            toastContent.classList.add('scale-100');

            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
                toastContent.classList.remove('scale-100');
                toastContent.classList.add('scale-90');
            }, 3000);
        };

        // Trigger simulation on Check In button click
        document.querySelector('button.bg-primary').addEventListener('click', (e) => {
            const input = document.getElementById('booking-id');
            if(input.value.trim() !== "") {
                simulateScan();
                input.value = "";
            }
        });

        // Responsive behavior for scan line height or animation could be tweaked here
    </script>
