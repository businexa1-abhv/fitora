            grid-template-columns: repeat(12, 1fr);

        }

            .bento-grid {
                grid-template-columns: 1fr;

<body class="bg-background text-on-background font-body-md min-h-screen pb-32">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm h-16 flex justify-between items-center px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95 duration-100">
                arrow_back
            </button>
<h1 class="font-display-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tighter">FitOra Owner</h1>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95 duration-100" data-icon="notifications">notifications</span>
</div>
</header>
<main class="pt-24 px-margin-mobile md:max-w-4xl md:mx-auto">
<div class="flex flex-col gap-stack-lg">
<!-- Context Header -->
<div class="flex justify-between items-end">
<div>
<span class="text-label-lg font-label-lg text-secondary uppercase tracking-widest">Expense Details</span>
<h2 class="text-headline-md font-headline-md text-primary mt-1">Edit Transaction</h2>
</div>
<div class="hidden md:flex gap-4">
<button class="px-6 py-2 rounded-full border border-outline text-on-surface hover:bg-surface-container transition-all active:scale-95">Discard</button>
<button class="px-6 py-2 rounded-full bg-primary text-on-primary shadow-lg hover:bg-primary-container transition-all active:scale-95">Save Changes</button>
</div>
</div>
<!-- Main Form Canvas -->
<form class="bento-grid" id="expenseForm">
<!-- Basic Info Card -->
<section class="col-span-12 md:col-span-8 bg-surface-container-lowest border border-outline-variant p-6 rounded-xl flex flex-col gap-6">
<div class="space-y-4">
<div class="relative">
<label class="block text-label-lg font-label-lg text-outline mb-1">Expense Title</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg p-3 text-body-lg font-body-lg text-on-surface form-focus-ring outline-none transition-all" placeholder="Enter title..." type="text" value="AC Repair - Main Hall"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="relative">
<label class="block text-label-lg font-label-lg text-outline mb-1">Category</label>
<select class="w-full bg-surface-bright border border-outline-variant rounded-lg p-3 text-body-md font-body-md text-on-surface form-focus-ring outline-none appearance-none">
<option selected="" value="maintenance">Maintenance</option>
<option value="equipment">Equipment</option>
<option value="utilities">Utilities</option>
<option value="marketing">Marketing</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-10 pointer-events-none text-outline">expand_more</span>
</div>
<div class="relative">
<label class="block text-label-lg font-label-lg text-outline mb-1">Date</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg p-3 text-body-md font-body-md text-on-surface form-focus-ring outline-none" type="date" value="2023-10-24"/>
</div>
</div>
<div class="relative">
<label class="block text-label-lg font-label-lg text-outline mb-1">Notes</label>
<textarea class="w-full bg-surface-bright border border-outline-variant rounded-lg p-3 text-body-md font-body-md text-on-surface form-focus-ring outline-none transition-all" placeholder="Add additional details about this expense..." rows="4">Regular quarterly maintenance for the central AC unit in the main basketball court. Filter replaced and gas refilled.</textarea>
</div>
</div>
</section>
<!-- Financials & Receipt Side Column -->
<aside class="col-span-12 md:col-span-4 flex flex-col gap-6">
<!-- Amount & Payment Card -->
<div class="bg-primary text-on-primary p-6 rounded-xl shadow-md space-y-4">
<div class="relative">
<label class="block text-label-lg font-label-lg text-primary-fixed opacity-80 mb-1">Amount (₹)</label>
<div class="flex items-center gap-2">
<span class="text-headline-md font-label-lg">₹</span>
<input class="w-full bg-transparent border-b border-on-primary-container text-display-lg font-label-lg focus:border-white outline-none py-1 tracking-tight" style="font-family: 'JetBrains Mono';" type="text" value="2,500"/>
</div>
</div>
<div class="relative pt-4">
<label class="block text-label-lg font-label-lg text-primary-fixed opacity-80 mb-2">Payment Method</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-1.5 rounded-full border border-on-primary-container text-body-md hover:bg-white/10 transition-all flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]">payments</span> Cash
                                </button>
<button class="px-4 py-1.5 rounded-full bg-on-primary-container text-primary font-bold text-body-md shadow-sm flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">credit_card</span> Card
                                </button>
<button class="px-4 py-1.5 rounded-full border border-on-primary-container text-body-md hover:bg-white/10 transition-all flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]">qr_code_2</span> UPI
                                </button>
</div>
</div>
</div>
<!-- Receipt Upload -->
<div class="bg-surface-container-low border-2 border-dashed border-outline-variant rounded-xl p-8 flex flex-col items-center justify-center gap-3 cursor-pointer hover:border-primary transition-colors group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary">cloud_upload</span>
</div>
<div class="text-center">
<p class="text-title-md font-title-md text-on-surface">Upload Receipt</p>
<p class="text-body-md text-outline">JPEG, PNG or PDF up to 5MB</p>
</div>
<input class="hidden" type="file"/>
</div>
</aside>
<!-- Desktop Bottom Actions (Sticky on mobile, grid on desktop) -->
<div class="col-span-12 flex flex-col md:flex-row items-center justify-between pt-6 border-t border-outline-variant mt-4">
<a class="flex items-center gap-2 text-error font-title-md hover:underline active:scale-95 duration-100 transition-all" href="#">
<span class="material-symbols-outlined">delete</span>
                        Delete Expense
                    </a>
<div class="mt-8 md:mt-0 w-full md:w-auto flex flex-col md:hidden gap-3">
<button class="w-full py-4 rounded-xl bg-primary text-on-primary font-title-md shadow-lg active:scale-95 transition-transform">Save Changes</button>
<button class="w-full py-3 rounded-xl text-outline font-title-md active:scale-95 transition-transform">Discard Changes</button>
</div>
</div>
</form>
</div>
</main>
<!-- Bottom Navigation Shell (From JSON Guidance) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center py-2 px-2 bg-surface dark:bg-surface-dim border-t border-outline-variant dark:border-outline z-50 rounded-t-xl shadow-[0px_-4px_16px_rgba(0,0,0,0.04)]">
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-variant transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-variant transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="settings_suggest">settings_suggest</span>
<span class="font-label-md text-label-md">Manage</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-variant transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="event_available">event_available</span>
<span class="font-label-md text-label-md">Bookings</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="payments" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-md text-label-md">Finance</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-4 py-1 hover:bg-surface-variant transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
<span class="font-label-md text-label-md">More</span>
</a>
</nav>
<!-- Visual Polish: Soft Ambient Glow -->
<div class="fixed top-0 right-0 -z-10 w-[500px] h-[500px] bg-primary/5 blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-0 left-0 -z-10 w-[500px] h-[500px] bg-secondary/5 blur-[120px] pointer-events-none"></div>
<script>
        // Micro-interactions for form inputs
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });

        // Payment method toggle logic
        const paymentBtns = document.querySelectorAll('.flex.flex-wrap.gap-2 button');
        paymentBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                paymentBtns.forEach(b => {
                    b.classList.remove('bg-on-primary-container', 'text-primary', 'font-bold', 'shadow-sm');
                    b.classList.add('border', 'border-on-primary-container', 'text-body-md');
                    const icon = b.querySelector('.material-symbols-outlined');
                    if (icon) icon.style.fontVariationSettings = "'FILL' 0";
                });
                btn.classList.add('bg-on-primary-container', 'text-primary', 'font-bold', 'shadow-sm');
                btn.classList.remove('border', 'border-on-primary-container');
                const activeIcon = btn.querySelector('.material-symbols-outlined');
                if (activeIcon) activeIcon.style.fontVariationSettings = "'FILL' 1";
            });
        });

        // Success notification mockup
        document.querySelectorAll('button').forEach(btn => {
            if (btn.innerText === "Save Changes") {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    btn.innerText = "Saving...";
                    btn.disabled = true;
                    setTimeout(() => {
                        btn.innerText = "Changes Saved!";
                        btn.classList.replace('bg-primary', 'bg-secondary');
                        setTimeout(() => {
                            btn.innerText = "Save Changes";
                            btn.classList.replace('bg-secondary', 'bg-primary');
                            btn.disabled = false;
                        }, 2000);
                    }, 800);
                });
            }
        });
    </script>
</body></html>
