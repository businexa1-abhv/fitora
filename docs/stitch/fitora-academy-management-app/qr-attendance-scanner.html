<style>
    .scanner-mask {
      background: rgba(0, 0, 0, 0.6);
      mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect width="100%" height="100%" fill="black"/><rect x="50%" y="40%" width="260" height="260" rx="24" fill="white" transform="translate(-130, -130)"/></svg>') exclude;
      -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect width="100%" height="100%" fill="black"/><rect x="50%" y="40%" width="260" height="260" rx="24" fill="white" transform="translate(-130, -130)"/></svg>') exclude;
    }
    
    @keyframes scan-line {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .scanning-line {
      animation: scan-line 2.5s ease-in-out infinite;
    }

    .reticle-corner {
      border-color: #ff6b00; /* primary-container */
      border-width: 4px;
    }

    .toast-enter { transform: translateY(100px); opacity: 0; }
    .toast-active { transform: translateY(0); opacity: 1; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md overflow-hidden">
<!-- Top AppBar (from JSON - Semantic Shell) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface shadow-sm flex justify-between items-center h-16 px-container-margin-mobile w-full">
<div class="flex items-center gap-3">
<button class="material-symbols-outlined text-primary hover:bg-surface-container-low transition-colors p-2 rounded-full active:scale-95 transition-transform">arrow_back</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-container">Attendance</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A professional fitness coach profile portrait with clean lighting and a high-performance athletic aesthetic. The coach is wearing modern navy blue technical sportswear. The background is a crisp, brightly lit minimalist gym with soft focus, maintaining the brand's precision and clarity principles." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7MRF7rBkXnQT05v54f7q5U6uOjMJ-JRFZ-WbFYwD7njMsBBHoZpswzz2gVDdKKs9pn7FYQcPSRTQcQYFp2kM9Hy8avM8oDzzrdfqN_BIaMXa_yIl_nLQfYTPr64EGAZtZJVu26sxJbOtTBeBWfPBF5-u858JZW9fA8KoTzqoUmpInUA4LWqRwt3LA1kKbZxWLYmQcg6mWyWkW4O1oGr1d124FTHTtGJwqJT2qDI36GqyqMzF7Hw5i"/>
</div>
</header>
<!-- Full-Screen Camera View -->
<main class="relative h-screen w-full bg-black">
<!-- Mock Camera Stream -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-80" data-alt="A high-resolution perspective view from a mobile phone camera lens looking at a modern gym interior. A blur of gym equipment like dumbbells and kettlebells is visible in the background under bright studio lighting. The scene is slightly dimmed to accommodate a scanning UI overlay, focusing on the cinematic and high-energy coaching environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDBdPUhkPe_D0R5jbHtS-i-whl6CwJ4vGge_EaY1pup9ZCkHSM4AvlOt6qd1Zi-rJ0AzwnheLPT_fGFFGeEYtet_CI4ajbuaFUDnQkzBIYh-6c9IzBrgdo-pz92f_kU5L_y86D_gED4_li_hpbh_2mKB3hUyIIkKqnW2dQnIQWdgPsD4pqCAfWI5eJdsZ6ely3jY04ObEK4QP0Y50ixJinLFgI-jhmJj47hAMxoDLweN1i85P6OjP2z"/>
</div>
<!-- Scanner UI Overlay -->
<div class="absolute inset-0 z-10 scanner-mask pointer-events-none"></div>
<div class="absolute inset-0 z-20 flex flex-col items-center justify-center">
<!-- Reticle Container -->
<div class="relative w-[260px] h-[260px] -mt-20">
<!-- Corners -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-primary-container rounded-tl-3xl"></div>
<div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-primary-container rounded-tr-3xl"></div>
<div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-primary-container rounded-bl-3xl"></div>
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-primary-container rounded-br-3xl"></div>
<!-- Animated Scanning Line -->
<div class="scanning-line absolute left-4 right-4 h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent shadow-[0_0_15px_rgba(255,107,0,0.8)]"></div>
</div>
<!-- Instruction Text -->
<div class="mt-8 text-center px-8">
<p class="text-white font-title-lg mb-2">Align student ID QR within frame</p>
<p class="text-white/60 font-body-md">Scanning will happen automatically</p>
</div>
</div>
<!-- Controls Layer -->
<div class="absolute bottom-0 left-0 w-full z-30 p-container-margin-mobile flex flex-col gap-6">
<!-- Flashlight Toggle -->
<div class="flex justify-center">
<button class="w-14 h-14 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-white hover:bg-white/20 active:scale-90 transition-all duration-200" id="torchBtn">
<span class="material-symbols-outlined text-3xl">flashlight_on</span>
</button>
</div>
<!-- Manual Entry Card -->
<div class="bg-surface rounded-xl shadow-xl p-md border border-outline-variant">
<div class="flex flex-col gap-4">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-secondary text-[20px]">keyboard</span>
<h2 class="font-label-lg text-label-lg text-secondary uppercase tracking-widest">Manual Entry</h2>
</div>
<div class="flex gap-2">
<div class="relative flex-1">
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all outline-none" placeholder="Booking or Student ID" type="text"/>
</div>
<button class="bg-primary-container text-white px-6 rounded-lg font-headline-md text-[14px] flex items-center justify-center active:scale-95 transition-transform shadow-lg shadow-primary-container/20" onclick="showSuccessToast()">
              Check-in
            </button>
</div>
</div>
</div>
<!-- Spacer for bottom safe area -->
<div class="h-4"></div>
</div>
</main>
<!-- Success Toast Notification -->
<div class="fixed bottom-32 left-1/2 -translate-x-1/2 z-50 toast-enter" id="successToast">
<div class="bg-tertiary-container text-on-tertiary-container px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 border border-white/20 backdrop-blur-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-md font-bold">Check-in Successful</span>
</div>
</div>
<script>
    const toast = document.getElementById('successToast');
    const torchBtn = document.getElementById('torchBtn');
    let torchOn = false;

    function showSuccessToast() {
      toast.classList.remove('toast-enter');
      toast.classList.add('toast-active');
      
      // Simulate kinetic vibration or sound effect if needed
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(50);
      }

      setTimeout(() => {
        toast.classList.remove('toast-active');
        toast.classList.add('toast-enter');
      }, 3000);
    }

    torchBtn.addEventListener('click', () => {
      torchOn = !torchOn;
      const icon = torchBtn.querySelector('.material-symbols-outlined');
      if (torchOn) {
        torchBtn.classList.add('bg-primary-container', 'text-white');
        torchBtn.classList.remove('bg-white/10');
        icon.innerText = 'flashlight_off';
      } else {
        torchBtn.classList.remove('bg-primary-container', 'text-white');
        torchBtn.classList.add('bg-white/10');
        icon.innerText = 'flashlight_on';
      }
    });

    // Auto-dismiss logic for the manual check-in button (UX polish)
    document.querySelector('input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') showSuccessToast();
    });

    // Interaction micro-animations
    document.querySelectorAll('.active\\:scale-95').forEach(btn => {
      btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
      btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
      btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
    });
  </script>
</body></html>
