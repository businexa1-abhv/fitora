<style>
        body {
            font-family: 'Lexend', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .success-toast-animation {
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUpFade {
            from { transform: translateY(100%) translateX(-50%); opacity: 0; }
            to { transform: translateY(0) translateX(-50%); opacity: 1; }
        }
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px #15157d;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-24">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm h-16">
<div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop h-full max-w-container-max mx-auto">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-secondary active:scale-95 transition-transform" onclick="history.back()">arrow_back</button>
<h1 class="font-title-md text-title-md text-primary">Edit Profile</h1>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">notifications</span>
</div>
</div>
</header>
<main class="mt-20 px-margin-mobile max-w-2xl mx-auto space-y-stack-lg">
<!-- Profile Photo Edit Section -->
<section class="flex flex-col items-center justify-center py-stack-lg">
<div class="relative group">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-surface-container-high shadow-sm ring-2 ring-primary/10">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a confident sports academy owner, clean lighting, minimalist background, corporate modernism style, deep indigo and white palette, sharp focus, high-end photography." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqcFH5apulfa9ACYpalAg6CxC7OYJXxgyyGgFa-U4sDwvJAmHhzlnypgQlDOtCTlsX2OBx5JZrXe8gY0XYaIxWYr6XlRDqrsnWIXODfOYnIptvKGBGjPNK7NnTRnvtCPZ1rZxlYfJsD3T-zXLOsM9FRxWt06Wkc2GwmkNWPnYBr1cMHYn4kpOtiARc7rCcG_B5v0c_-uEGsJkOPon0M1Zl_ORmOvhhf5sD72NFC1SID03TX6gWFz_O"/>
</div>
<!-- Overlay Button -->
<button class="absolute inset-0 bg-primary/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200 backdrop-blur-[2px]">
<span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
<div class="absolute bottom-1 right-1 bg-primary text-on-primary rounded-full p-2 shadow-lg border-2 border-surface">
<span class="material-symbols-outlined text-sm">edit</span>
</div>
</div>
<p class="mt-4 font-label-lg text-label-lg text-primary uppercase tracking-wider">Change Profile Photo</p>
</section>
<!-- Form Inputs -->
<section class="space-y-stack-md">
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-outline ml-1">Full Name</label>
<div class="relative group">
<input class="w-full h-14 px-4 bg-surface-container-lowest border border-outline-variant rounded-xl focus:border-primary focus:ring-0 outline-none transition-all font-body-lg text-body-lg text-on-surface" placeholder="Enter your full name" type="text" value="Alexander Sterling"/>
<span class="material-symbols-outlined absolute right-4 top-4 text-outline group-focus-within:text-primary">person</span>
</div>
</div>
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-outline ml-1">Email Address</label>
<div class="relative group">
<input class="w-full h-14 px-4 bg-surface-container-lowest border border-outline-variant rounded-xl focus:border-primary focus:ring-0 outline-none transition-all font-body-lg text-body-lg text-on-surface" placeholder="Enter your email" type="email" value="alex.sterling@fitora.academy"/>
<span class="material-symbols-outlined absolute right-4 top-4 text-outline group-focus-within:text-primary">mail</span>
</div>
</div>
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-outline ml-1">Phone Number</label>
<div class="relative group">
<input class="w-full h-14 px-4 bg-surface-container-lowest border border-outline-variant rounded-xl focus:border-primary focus:ring-0 outline-none transition-all font-body-lg text-body-lg text-on-surface" placeholder="Enter your phone" type="tel" value="+1 (555) 902-3481"/>
<span class="material-symbols-outlined absolute right-4 top-4 text-outline group-focus-within:text-primary">call</span>
</div>
</div>
</section>
<!-- Navigation Rows -->
<section class="bg-surface-container-low rounded-2xl overflow-hidden">
<button class="w-full flex items-center justify-between p-stack-md hover:bg-surface-container-high transition-colors group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<div class="text-left">
<p class="font-title-md text-title-md text-on-surface">Security &amp; Access</p>
<p class="font-body-md text-body-md text-outline">Passwords, 2FA, and sessions</p>
</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
</section>
<!-- Save Button -->
<section class="pt-stack-lg">
<button class="w-full h-14 bg-primary text-on-primary rounded-2xl font-title-md text-title-md shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2" onclick="showSuccessToast()">
                Save Changes
            </button>
</section>
</main>
<!-- Navigation Shell (Bottom Bar) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center py-2 px-2 bg-surface border-t border-outline-variant z-50">
<a class="flex flex-col items-center justify-center text-secondary px-4 py-1" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary px-4 py-1" href="#">
<span class="material-symbols-outlined">settings_suggest</span>
<span class="font-label-md text-label-md">Manage</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">menu</span>
<span class="font-label-md text-label-md">More</span>
</a>
</nav>
<!-- Success Toast Container -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-sm z-[100] pointer-events-none" id="toast-container"></div>
<script>
        function showSuccessToast() {
            const container = document.getElementById('toast-container');
            
            // Create toast element
            const toast = document.createElement('div');
            toast.className = 'success-toast-animation flex items-center gap-3 p-4 bg-secondary-container text-on-secondary-container rounded-2xl shadow-xl border border-secondary/20';
            toast.innerHTML = `
                <div class="flex-shrink-0 w-8 h-8 bg-on-secondary-fixed-variant rounded-full flex items-center justify-center text-white">
                    <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                </div>
                <div class="flex-grow">
                    <p class="font-title-md text-title-md font-semibold">Profile updated successfully</p>
                </div>
            `;

            container.appendChild(toast);

            // Remove after 3 seconds
            setTimeout(() => {
                toast.style.transition = 'all 0.4s ease';
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px) translateX(-50%)';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }
    </script>
</body></html>
