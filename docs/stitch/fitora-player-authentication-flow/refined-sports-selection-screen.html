            Continue
        </button>
</footer>
<script>
        let selectedCount = 0;
        const continueBtn = document.getElementById('continueBtn');

        function toggleSelection(el) {
            const isSelected = el.classList.contains('sport-card-selected');

            if (isSelected) {
                el.classList.remove('sport-card-selected');
                selectedCount--;
            } else {
                el.classList.add('sport-card-selected');
                selectedCount++;
            }

            updateButtonState();

            // Haptic feedback simulation
            el.classList.add('scale-90');
            setTimeout(() => el.classList.remove('scale-90'), 100);
        }

        function updateButtonState() {
            if (selectedCount > 0) {
                continueBtn.disabled = false;
                continueBtn.classList.remove('opacity-50', 'grayscale');
            } else {
                continueBtn.disabled = true;
                continueBtn.classList.add('opacity-50', 'grayscale');
            }
        }
    </script>
