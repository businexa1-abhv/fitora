<script>
        // Simple Confetti Effect
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.size = Math.random() * 8 + 4;
                this.weight = Math.random() * 2 + 1;
                this.directionX = (Math.random() - 0.5) * 15;
                this.directionY = (Math.random() - 0.7) * 20;
                this.color = ['#ff6b00', '#FF3278', '#FFDB17', '#059eff'][Math.floor(Math.random() * 4)];
            }
            update() {
                this.y += this.directionY;
                this.x += this.directionX;
                this.directionY += 0.5; // gravity
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].y > canvas.height) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            if (particles.length > 0) requestAnimationFrame(animate);
        }

        // Trigger on load
        setTimeout(() => {
            init();
            animate();
        }, 300);

        // QR Code Flicker micro-interaction
        const qrDots = document.querySelectorAll('.grid > div');
        setInterval(() => {
            const randomIndex = Math.floor(Math.random() * qrDots.length);
            qrDots[randomIndex].classList.toggle('bg-deep-navy');
            qrDots[randomIndex].classList.toggle('bg-transparent');
        }, 100);
    </script>
