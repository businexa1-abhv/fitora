<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        .slide-up {
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Top App Bar -->
<header class="w-full sticky top-0 bg-background/80 backdrop-blur-md z-50">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-7xl mx-auto">
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">FitOra</span>
<div class="flex gap-2">
<button class="material-symbols-outlined text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95">help</button>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-start w-full pb-10">
<!-- Hero Illustration Section -->
<section class="w-full px-margin-mobile mb-10 slide-up stagger-1">
<div class="w-full max-w-md mx-auto aspect-[3/2] rounded-[32px] overflow-hidden shadow-xl">

</div>
</section>
<!-- Welcome Text Section -->

<h1 class="font-display-lg-mobile text-[32px] font-bold text-on-surface mb-4 leading-tight">Welcome to FitOra</h1>
<p class="font-display-lg-mobile text-body-lg font-light text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                Join the ultimate sports community and start booking today.
            </p>
</section>
<!-- Authentication Options -->
<section class="w-full max-w-md px-margin-mobile flex flex-col gap-4 slide-up stagger-3">
<!-- Primary CTA -->
<button class="w-full bg-primary text-white font-label-lg text-label-lg h-[56px] rounded-full flex items-center justify-center gap-3 shadow-md hover:brightness-110 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined">smartphone</span>
                Continue with Mobile Number
            </button>
<!-- Social Logins -->
<div class="flex flex-col gap-3">
<button class="w-full bg-surface text-on-surface font-label-lg text-label-lg h-[56px] rounded-full flex items-center justify-center gap-3 border border-outline hover:bg-surface-variant/10 active:scale-[0.98] transition-all slide-up stagger-4">

<a class="text-primary font-bold hover:underline" href="#">Terms of Service</a> &amp;

</p>

<!-- Bottom Padding for safe area -->
<div class="h-8"></div>
<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.style.transform = 'scale(0.97)';
            });
            btn.addEventListener('touchend', function() {
                this.style.transform = 'scale(1)';
            });
        });
    </script>
