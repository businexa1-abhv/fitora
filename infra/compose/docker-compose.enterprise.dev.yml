version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: fitora_enterprise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitora
      POSTGRES_USER: fitora
      POSTGRES_PASSWORD: fitora
    ports:
      - '5441:5432'
    volumes:
      - fitora_enterprise_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fitora_enterprise_redis
    restart: unless-stopped
    ports:
      - '6380:6379'

volumes:
  fitora_enterprise_pgdata:
