# FitOra reverse proxy — TLS terminated at Cloudflare (Full Strict) or locally via certbot
# Replace fitora.com with your production domain

# Cloudflare real client IP
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

upstream fitora_api {
  server api:3001;
  keepalive 32;
}

upstream fitora_web {
  server web:3000;
  keepalive 16;
}

upstream fitora_admin {
  server admin:3002;
  keepalive 16;
}

# Redirect HTTP → HTTPS (when not behind Cloudflare orange-cloud)
server {
  listen 80;
  server_name fitora.com www.fitora.com admin.fitora.com api.fitora.com;
  return 301 https://$host$request_uri;
}

# ─── Public web app ───────────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name fitora.com www.fitora.com;

  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  limit_req zone=general_limit burst=100 nodelay;

  location / {
    proxy_pass http://fitora_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# ─── Admin dashboard ──────────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name admin.fitora.com;

  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Optional IP allowlist for admin (uncomment and set office/VPN CIDR)
  # allow 203.0.113.0/24;
  # deny all;

  location / {
    proxy_pass http://fitora_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ─── API ──────────────────────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name api.fitora.com;

  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 20m;

  limit_req zone=api_limit burst=60 nodelay;

  location /api/v1/health {
    proxy_pass http://fitora_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  location / {
    proxy_pass http://fitora_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }
}
