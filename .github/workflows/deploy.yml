name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fitora

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_PREFIX }}-api
            ${{ env.IMAGE_PREFIX }}-web
            ${{ env.IMAGE_PREFIX }}-admin
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }},${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }},${{ env.IMAGE_PREFIX }}-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.fitora.com/api/v1' }}
            NEXT_PUBLIC_ADMIN_URL=${{ vars.NEXT_PUBLIC_ADMIN_URL || 'https://admin.fitora.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-admin:${{ github.sha }},${{ env.IMAGE_PREFIX }}-admin:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.fitora.com/api/v1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ecs:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: vars.AWS_DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Login to GHCR
        if: vars.AWS_DEPLOY_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Amazon ECR
        if: vars.AWS_DEPLOY_ENABLED == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to ECR
        if: vars.AWS_DEPLOY_ENABLED == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for app in api web admin; do
            docker pull ${{ env.IMAGE_PREFIX }}-${app}:${IMAGE_TAG}
            docker tag ${{ env.IMAGE_PREFIX }}-${app}:${IMAGE_TAG} ${ECR_REGISTRY}/fitora-${app}:${IMAGE_TAG}
            docker push ${ECR_REGISTRY}/fitora-${app}:${IMAGE_TAG}
          done

      - name: Deploy ECS service
        if: vars.AWS_DEPLOY_ENABLED == 'true'
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER || 'fitora-prod' }} \
            --service fitora-api \
            --force-new-deployment

      - name: Note on migrations
        if: vars.AWS_DEPLOY_ENABLED == 'true'
        run: |
          echo "Database migrations run automatically via API container entrypoint (prisma migrate deploy)"

      - name: Skip AWS deploy (not configured)
        if: vars.AWS_DEPLOY_ENABLED != 'true'
        run: echo "Set AWS_DEPLOY_ENABLED=true and configure secrets to enable ECS deployment"

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: vars.SMOKE_TEST_URL != ''
    steps:
      - name: Health check
        run: |
          curl -fsSL "${{ vars.SMOKE_TEST_URL }}/api/v1/health/ready"
          echo "API readiness OK"
