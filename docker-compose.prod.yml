# FitOra production stack — use with: docker compose -f docker-compose.prod.yml up -d
# Copy .env.production.example → .env.production and fill secrets before deploying.

name: fitora-prod

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: fitora-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks:
      - fitora_public
      - fitora_internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fitora-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/v1/health/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - fitora_internal
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
    container_name: fitora-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - fitora_internal
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: fitora-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3002/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - fitora_internal
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  postgres:
    image: postgres:16-alpine
    container_name: fitora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-fitora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fitora} -d ${POSTGRES_DB:-fitora}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitora_internal
    # Do not expose Postgres publicly in production

  redis:
    image: redis:7-alpine
    container_name: fitora-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitora_internal

  # Optional: run backups on schedule via host cron calling docker exec
  backup:
    image: postgres:16-alpine
    container_name: fitora-backup
    profiles: ['backup']
    env_file:
      - .env.production
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infra/scripts:/scripts:ro
      - ./infra/backups:/backups
    entrypoint: ['/bin/sh', '-c', 'while true; do /scripts/backup-db.sh; sleep 86400; done']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fitora_internal

networks:
  fitora_public:
    driver: bridge
  fitora_internal:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
