services:
  postgres:
    image: postgres:16-alpine
    container_name: fitora-postgres
    restart: unless-stopped
    ports:
      - '5440:5432'
    environment:
      POSTGRES_USER: fitora
      POSTGRES_PASSWORD: fitora
      POSTGRES_DB: fitora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitora -d fitora']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fitora-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
